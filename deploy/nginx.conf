# Виртуальный хост Nginx для сайта ИФТТ РАН.
# Плейсхолдеры __DOMAIN__, __APP_DIR__ и __PHP_VERSION__ подставляет deploy/setup-server.sh.
# Блок HTTPS добавляет certbot автоматически.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    root __APP_DIR__/public;
    index index.php;

    charset utf-8;
    client_max_body_size 64M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    access_log /var/log/nginx/issp.access.log;
    error_log /var/log/nginx/issp.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Собранные ассеты и загруженные файлы — долгий кеш
    location ~* ^/(build|storage)/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php__PHP_VERSION__-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
